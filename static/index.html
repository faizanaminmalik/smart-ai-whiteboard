<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Whiteboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    h1 { margin-bottom: 8px; }
    p { color: #94a3b8; margin-bottom: 20px; }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      background: #ffffff;
      cursor: crosshair;
      display: block;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    #output {
      margin-top: 20px;
      padding: 12px 24px;
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 1.1rem;
    }
    .highlight { color: #38bdf8; font-weight: bold; }
  </style>
  <!-- ONNX Runtime Web with WebGPU support -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.webgpu.min.js"></script>
</head>
<body>
  <h1>Smart Whiteboard</h1>
  <p>Draw a shape (cloud, server, user, database) to test WebGPU local classification</p>
  
  <div id="canvas-container">
    <canvas id="whiteboard" width="400" height="400"></canvas>
  </div>

  <div class="controls">
    <button id="clear-btn">Clear Canvas</button>
  </div>

  <div id="output">Status: <span class="highlight">Loading ONNX WebGPU Engine...</span></div>

  <script src="/static/app.js"></script>
</body>
</html>
